name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Refresh the default branch's build cache without repeating every push.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

# Each job declares the permissions it needs.
permissions:
  contents: read

concurrency:
  # Every merge queue entry shares one group.
  # A newer entry's run therefore cancels the runs of the entries ahead of it.
  # The queue merges on the result of the newest entry, whose merge-group
  # commit contains every entry ahead of it.
  #
  # That works only while the queue groups HEADGREEN. Under ALLGREEN, a
  # cancelled entry fails.
  # Outside the queue, a draft run gets a group of its own, so it never cancels
  # the ready run.
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name == 'merge_group' && format('queue-{0}',
    github.event.merge_group.base_ref) || format('{0}-{1}{2}', github.event_name,
    github.event.pull_request.number || github.ref_name, github.event.pull_request.draft && '-draft'
    || '') }}
  cancel-in-progress: true

env:
  # Tests that create git repositories get main as their first branch,
  # whatever the runner image's git defaults to.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The CI profile; local work loads dev from .miserc.toml, which CI never does.
  MISE_ENV: ci

jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call on the runner chosen when this repository was rendered.
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main

  # Whether a pull request changes anything the build reads. Documentation is
  # the root's Markdown files, docs/, and openspec/. A documentation file
  # still counts as a build input when a Go source names its path.
  changes:
    name: Changes
    # It runs on a pull request and a merge group.
    # A merge group compares its head with its base, so a group of
    # documentation-only pull requests skips the build in the queue too.
    if: >-
      ${{ !github.event.pull_request.draft && github.event_name != 'push'
      && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merge group diffs with git from its base commit.
          # A job with no credentials cannot fetch that commit later in a
          # private repository, so its checkout takes the whole history.
          # The '0' is a string, so the || does not drop it.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            all:
              - '**'
            docs:
              - '*.md'
              - 'docs/**'
              - 'openspec/**'
              - 'tasks.yaml'
              - '.changeset/*.md'
      - name: Decide whether to build
        id: scope
        shell: bash
        env:
          ALL: ${{ steps.filter.outputs.all_count }}
          DOCS: ${{ steps.filter.outputs.docs_count }}
          DOCS_FILES: ${{ steps.filter.outputs.docs_files }}
        run: |
          # A //go:embed line names files with no quotes, as a directory or a
          # glob, relative to its own package, and a package embeds only files
          # in its own directory or below. So a Go source with such a line, in
          # the file's directory or a directory above it, may embed the file.
          embeds() {
            local dir=$1
            while :; do
              if git grep -qE '^[[:space:]]*//go:embed' -- ":(glob)${dir:+$dir/}*.go"; then
                return 0
              fi
              if [ -z "$dir" ]; then
                return 1
              fi
              case $dir in
                */*) dir=${dir%/*} ;;
                *) dir='' ;;
              esac
            done
          }
          build=false
          if [ "$ALL" != "$DOCS" ]; then
            build=true
          else
            while IFS= read -r file; do
              # A source names the file by its path from the root, as a test
              # run there does, or by a relative path that ends in it.
              case $file in
                */*) dir=${file%/*} ;;
                *) dir='' ;;
              esac
              if git grep -qF -e "$file" -- '*.go' || embeds "$dir"; then
                echo "A source reads $file, so the build reads it."
                build=true
                break
              fi
            done < <(jq -r '.[]' <<<"$DOCS_FILES")
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"

  go-module-root:
    name: Build and test (go-module at .)
    needs: changes
    # A documentation-only pull request or merge group skips the build.
    # The Changes job is skipped on a push and a dispatch, and its output is
    # then empty. The build therefore runs there, and when Changes itself
    # failed.
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && needs.changes.outputs.build != 'false' && github.event_name != 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 31
    outputs:
      cache-saved: >-
        ${{ steps.cache_save.outcome == 'success' }}
    permissions:
      contents: read
      # A check:versions task reads a pull request that changes a manifest
      # version, to tell a version pull request apart from a hand edit.
      pull-requests: read
      # The mise action exchanges the job's token for the release mirror's.
      id-token: write
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked tools
        timeout-minutes: 5
        uses: victor-software-house/actions/mise@1faaba6ff4a50ea1ecd26485acff0a58b9ad66ac # main, 2026-11-22
        with:
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
          version: 2026.11.12
          # Only a run on the default branch writes the tools cache, as with
          # the build caches below.
          # A pull request or a merge group adds no entry of its own.
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # The pinned Go reports where its caches live. They are the module cache
      # and the build cache, which differ between macOS and Linux.
      # Compiled packages never carry across toolchains, so the Go version is in
      # the key. The key ends in the run, as the SwiftPM key does.
      - name: Locate the Go caches
        id: go
        shell: bash
        env:
          SUMS: ${{ hashFiles('**/go.sum') }}
        run: |
          version=$(mise x -- go env GOVERSION | tr -c 'A-Za-z0-9.' '-')
          {
            echo "version=$version"
            echo "prefix=go-root-$RUNNER_OS-$RUNNER_ARCH-$version-"
            echo "sum=$SUMS"
            echo "mod=$(mise x -- go env GOMODCACHE)"
            echo "build=$(mise x -- go env GOCACHE)"
          } >>"$GITHUB_OUTPUT"
      - name: Restore the Go module and build caches
        id: cache
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: "${{ steps.go.outputs.prefix }}${{ steps.go.outputs.sum }}-\
            ${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: |
            ${{ steps.go.outputs.prefix }}${{ steps.go.outputs.sum }}-
            ${{ steps.go.outputs.prefix }}
      - name: Run go:verify
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run go:verify
      - name: Run go:vuln
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run go:vuln
      # Only a run on the default branch saves.
      # A pull request, a merge group and a run on another branch restore and
      # never write. No entry that another run restores therefore comes from
      # unreviewed code.
      #
      # A merge group's entry sits on its own branch, which no pull request
      # restores from. A repository that lands through a merge queue has no
      # push run. Its daily refresh therefore dispatches CI on the default
      # branch.
      - name: Save the Go module and build caches
        id: cache_save
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ steps.go.outputs.mod }}
            ${{ steps.go.outputs.build }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Each component's own task leaves out check:repo, so this job runs the
  # repository checks once, on every pull request and merge group.
  checks:
    name: Repository checks
    if: ${{ !github.event.pull_request.draft && github.event_name != 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The mise action exchanges the job's token for the release mirror's.
      id-token: write
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # mise installs each task's tools as the task runs.
      - name: Install mise
        timeout-minutes: 5
        uses: victor-software-house/actions/mise@1faaba6ff4a50ea1ecd26485acff0a58b9ad66ac # main, 2026-11-22
        with:
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
          version: 2026.11.12
          install: "false"
          # Only a run on the default branch writes the tools cache, as in the
          # builds.
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      - name: Run check:repo
        run: mise run check:repo

  # Each cache key ends in the run.
  # A run on the default branch that saved therefore leaves one entry of each
  # cache. This job deletes the older ones, newest kept.
  #
  # Only a run on the default branch saves, so cache-saved is true only there.
  # Only such a run needs the permission to delete.
  prune:
    name: Prune superseded caches
    needs: [go-module-root]
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && (needs.go-module-root.outputs.cache-saved == 'true') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Delete the superseded entries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in go-root-Linux-; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" \
              --limit 100 --json id,createdAt --jq 'sort_by(.createdAt) | reverse | .[1:][].id' |
              while IFS= read -r id; do
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
              done
          done

  # The one check a ruleset requires: it reports on every pull request and
  # merge queue run. It fails when a build or the repository checks failed or
  # were cancelled. A job skipped by its own condition counts as passing, as a
  # build does on a documentation-only pull request.
  verify:
    name: Verify
    needs: [changes, go-module-root, checks]
    if: ${{ always() && !github.event.pull_request.draft && github.event_name != 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    # Reads this run and its newer runs.
    permissions:
      actions: read
    steps:
      - uses: victor-software-house/actions/verify-jobs@1faaba6ff4a50ea1ecd26485acff0a58b9ad66ac # main, 2026-11-22
        with:
          needs: ${{ toJSON(needs) }}
          jobs: "go-module-root checks"
